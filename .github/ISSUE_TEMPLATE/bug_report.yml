name: Bug Report
description: Create a report to help us improve the SDK
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"
  - type: input
    id: version
    attributes:
      label: SDK Version
      description: What version of shopify_storefront_sdk are you using?
      placeholder: "e.g. 1.0.4"
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: "e.g. v20.12.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Please provide code snippets to reproduce the behavior.
      placeholder: |
        1. Initialize client with...
        2. Call shopify.getProducts()...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
